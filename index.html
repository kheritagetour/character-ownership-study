<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Creation Study</title>
<style>
  :root {
    --navy: #1c2a4a; --ink: #1f2430; --muted: #6b7385; --line: #d9dde6;
    --bg: #f7f7f5; --card: #ffffff; --accent: #2f5bd3; --warn: #b4441f; --ok: #2e7d4f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  header { background: var(--navy); color: #fff; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  header .step { opacity: .75; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 26px; color: var(--navy); margin: 0 0 6px; }
  h2 { font-size: 20px; color: var(--navy); margin: 24px 0 8px; }
  p.lead { color: var(--muted); margin-top: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin: 16px 0; }
  label.field { display: block; font-weight: 600; margin: 14px 0 6px; }
  label.field small { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=number], input[type=password], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--navy); }
  button.danger { background: #fff; color: var(--warn); border-color: var(--warn); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  .err { color: var(--warn); font-size: 14px; margin-top: 8px; min-height: 1em; }
  .muted { color: var(--muted); font-size: 14px; }
  .en { color: #9aa1b0; font-size: 12.5px; display: block; }
  /* Likert */
  .likert { border-top: 1px solid var(--line); }
  .likert .row { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .likert .opts { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .likert .opts label { cursor: pointer; font-size: 13px; color: var(--muted); }
  .likert .opts input { display: block; margin: 0 auto 2px; width: 20px; height: 20px; cursor: pointer; }
  .likert .anchors { display: grid; grid-template-columns: 1fr 360px; gap: 16px; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .likert .anchors div:last-child { display: flex; justify-content: space-between; }
  .likert .row.missing { background: #fff4f0; }
  @media (max-width: 720px) { .likert .row, .likert .anchors { grid-template-columns: 1fr; } }
  /* Slider */
  .slider-wrap { display: flex; align-items: center; gap: 12px; }
  .slider-wrap input[type=range] { flex: 1; }
  .slider-wrap output { min-width: 44px; font-weight: 700; text-align: right; }
  .slider-wrap.untouched input { opacity: .45; }
  /* Layouts */
  .split { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  .concept-panel { font-size: 14px; position: sticky; top: 12px; }
  .concept-panel dt { font-weight: 700; color: var(--navy); margin-top: 8px; }
  .concept-panel dd { margin: 0; white-space: pre-wrap; }
  .concept-panel img { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .three { grid-template-columns: 1fr; } }
  .three img { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .final-img { max-width: 340px; display: block; margin: 0 auto; border-radius: 8px; border: 1px solid var(--line); }
  /* Sketch */
  .sketch-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .sketch-tools button { padding: 6px 12px; font-size: 14px; }
  .sketch-tools button.on { outline: 3px solid var(--accent); }
  canvas#sketch { width: 100%; max-width: 600px; aspect-ratio: 3/4; border: 1px solid var(--line); border-radius: 8px; background: #fff; touch-action: none; cursor: crosshair; display: block; }
  /* Generation */
  .gen-status { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 8px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; }
  .timer.low { color: var(--warn); }
  .attempts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .attempt { border: 2px solid var(--line); border-radius: 8px; padding: 6px; background: #fff; font-size: 12.5px; }
  .attempt img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 4px; display: block; background: #eee; }
  .attempt.selectable { cursor: pointer; }
  .attempt.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,91,211,.2); }
  .attempt .cap { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--line); border-top-color: var(--navy); border-radius: 50%; animation: spin 1s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #eef1f7; color: var(--navy); font-size: 13px; font-weight: 600; }
  /* Admin */
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .radio-list label { display: block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; cursor: pointer; background: #fff; }
  .radio-list input { margin-right: 8px; }
  .world { background: #fbfaf6; border-left: 4px solid var(--navy); padding: 14px 18px; white-space: pre-wrap; }
</style>
</head>
<body>
<header><span id="hdr-title">Character Creation Study</span><span class="step" id="hdr-step"></span></header>
<main id="app"></main>

<script>
/* =====================================================================
 * CONFIG — 파일럿 후 조정할 값은 모두 여기에 있음
 * ===================================================================== */
const CONFIG = {
  STUDY_ID: 'GCT573-T2-ownership',
  N_PER_STRATUM: 8,                // 창작 경험 층(있음/없음)별 배정표 크기 (4명 블록 × 2)
  // 프롬프트 작성 시간 총량을 A/B 동일하게 (교수님 피드백: 시간 교란 통제)
  ROUND_SEC_A: 240,                // A: 단일 프롬프트 작성 고정 시간 (일찍 끝낼 수 없음)
  ROUND_SEC_B: 120,                // B: 1차 프롬프트 작성 고정 시간 (일찍 끝낼 수 없음)
  REVISION_SEC: 120,               // B: 1차 결과를 본 뒤 수정할 수 있는 최대 시간 (선택, 일찍 생성 가능) → B 총량 ≤ A
  USE_SKETCH: true,                // 손 스케치를 이미지 입력으로 함께 전달 (OpenAI·Mock만 지원)
  // 스케치를 함께 보낼 때 프롬프트 앞에 붙는 고정 지시문 (참가자에게 보이지 않음, A/B 동일)
  SKETCH_INSTRUCTION: 'Use the attached rough hand-drawn sketch as the primary reference for the character\'s pose, silhouette, proportions and key shapes. Keep the sketch\'s composition, and turn it into a finished character illustration that follows this description: ',
  PROMPT_MIN_CHARS: 60,            // 프롬프트 길이 범위 (A/B 동일)
  PROMPT_MAX_CHARS: 400,
  CONCEPT_SUGGESTED_SEC: 420,      // 컨셉 시트 권장 시간 (안내용, 강제 X) — 전체 30분 이내 목표
  SKETCH_SUGGESTED_SEC: 180,       // 스케치 권장 시간 (안내용, 강제 X)
  IMAGE: { width: 768, height: 1024 },  // 동일 출력 포맷/비율 (3:4)
  // 모든 프롬프트 뒤에 붙는 고정 스타일 (참가자에게 보이지 않음) — "Same AI model and visual style"
  STYLE_SUFFIX: ', single full-body character, front view, character concept art, clean digital illustration, soft lighting, plain light background',
  POLLINATIONS_MODEL: 'flux',
  OPENAI_MODEL: 'gpt-image-1.5',   // 연구자 화면에서 변경 가능
  OPENAI_QUALITY: 'medium',        // low | medium | high (화질↑ = 비용·시간↑)
  GEN_TIMEOUT_MS: 120000,
};
const roundSec = cond => cond === 'A' ? CONFIG.ROUND_SEC_A : CONFIG.ROUND_SEC_B;

// 창작 경험 층 — 모집 시 다양하게 구성하고, 층마다 따로 블록 배정해 조건 간 경험 분포를 맞춤
const STRATA = [
  { id: 'E', label: '창작 경험 있음', desc: '그림·캐릭터·스토리 창작을 취미나 전공·업무로 해 본 적 있음' },
  { id: 'N', label: '창작 경험 없음', desc: '관련 경험이 거의 없음' },
];

// 세계관 2개 — 참가자마다 하나를 무작위 배정 (조건 × 세계관 균형, 자극 일반화용)
const WORLDS = [
  {
    id: 'academy', short: '마법학교',
    title: '별빛 마법학교',
    summary: '구름 위 산꼭대기에 있는 마법학교',
    text:
`구름 위 산꼭대기에 있는 마법학교입니다. 입학 시험에 통과한 학생들이 기숙사에서 함께 지내며 물약 만들기, 마법 생물 돌보기, 별자리 마법 같은 수업을 듣습니다.
학교 안에는 끝이 보이지 않는 도서관, 마법 생물이 사는 온실, 학생들이 모이는 식당과 매점이 있습니다.`,
    people: ['갓 입학한 신입생', '까다로운 물약 교수', '도서관 사서', '마법 생물 사육사', '매점 주인', '학생회장'],
    hook: '최근 도서관에서 오래된 마법책 한 권이 사라진 뒤로, 학교 곳곳에서 이상한 일이 일어나고 있습니다.',
  },
  {
    id: 'city', short: '미래 도시',
    title: '2087 네온시티',
    summary: '사람과 로봇이 함께 사는 근미래 대도시',
    text:
`2087년, 사람과 로봇이 함께 살아가는 대도시입니다. 하늘에는 드론 택시가 날아다니고, 거리에는 네온 간판이 가득합니다.
도시 중심에는 거대 기업의 빌딩이 서 있고, 뒷골목에는 고장 난 로봇을 고치는 수리점과 작은 노점 시장이 있습니다.`,
    people: ['로봇 수리공', '배달 라이더', '실력 좋은 해커', '드론 경찰', '노점 음식점 사장', '기업 연구원'],
    hook: '최근 도시의 로봇들이 한밤중에 잠깐씩 동시에 멈추는 일이 계속되고 있습니다.',
  },
];
const TASK = {
  ko: '이 세계를 배경으로 하는 인터랙티브 스토리 또는 게임에 등장할 오리지널 캐릭터를 만들어 주세요.',
  en: 'Create an original character for an interactive story or game.',
};
const getWorld = (id = S?.world) => WORLDS.find(w => w.id === id) || WORLDS[0];
function worldHtml(w, compact) {
  return `${compact ? `<b>${esc(w.title)}</b>` : ''}
    <div class="world" style="${compact ? 'font-size:13.5px;margin-top:8px' : ''}">${esc(w.text)}</div>
    <p style="margin:12px 0 4px"><b>이런 인물들이 살고 있어요</b></p>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${w.people.map(p => `<span class="pill">${esc(p)}</span>`).join('')}</div>
    <p style="margin:12px 0 0"><b>요즘 이 세계에서는…</b> ${esc(w.hook)}</p>`;
}

/* =====================================================================
 * 측정 도구 (PDF Appendix A1–A5)
 * ===================================================================== */
const SCALES = {
  PO: { name: '심리적 소유감', items: [
    ['PO1', '법적 소유권과 관계없이, 나는 이 캐릭터가 내 것이라고 느낀다.', 'Regardless of its legal ownership status, I feel that this character is mine.'],
    ['PO2', '나는 이 캐릭터를 소유하고 있는 것처럼 느낀다.', 'I feel as though I own this character.'],
    ['PO3', '이 캐릭터가 내 것이라는 느낌이 강하게 든다.', 'I have a strong sense that this character is mine.'],
    ['PO4', '이것은 나의 캐릭터처럼 느껴진다.', 'This feels like my character.'],
    ['PO5', '나는 이 캐릭터에 대해 높은 수준의 개인적 소유감을 느낀다.', 'I feel a high degree of personal ownership over this character.'],
  ]},
  IA: { name: '의도 일치도', items: [
    ['IA1', '최종 캐릭터는 내가 원래 의도한 것을 반영한다.', 'The final character reflects what I originally intended.'],
    ['IA2', '최종 캐릭터는 AI 사용 전에 내가 만든 컨셉 시트 및 스케치와 일치한다.', 'The final character matches the concept sheet and sketch I made before using AI.'],
    ['IA3', '내가 계획한 이 캐릭터의 핵심 특징이 최종 이미지에 나타나 있다.', 'The key features I planned for this character appear in the final image.'],
  ]},
  AU: { name: '지각된 저자성', items: [
    ['AU1', '나는 내가 이 캐릭터의 창작자라고 느낀다.', 'I feel that I am the creator of this character.'],
    ['AU2', '나는 내가 이 캐릭터를 만드는 데 주된 기여자라고 생각한다.', 'I consider myself the main contributor to creating this character.'],
  ]},
  CC: { name: '지각된 창작 통제감', items: [
    ['CC1', '나는 캐릭터의 전반적인 창작 방향을 결정할 수 있었다.', 'I was able to determine the overall creative direction of the character.'],
    ['CC2', '나는 캐릭터 제작 과정을 어떻게 진행할지 결정하는 데 상당한 자율성을 가졌다.', 'I had considerable autonomy in deciding how the character creation process was carried out.'],
    ['CC3', '나는 캐릭터 제작 과제에 어떻게 접근할지 스스로 결정할 수 있었다.', 'I could independently decide how to approach the character creation task.'],
  ]},
};
const CREDIT_OPTIONS = [
  ['self', '나 자신', 'Myself'],
  ['joint', '나와 AI 공동', 'Myself and AI jointly'],
  ['ai_main', '주로 AI, 나는 보조', 'Mainly AI, with my assistance'],
  ['other', '기타', 'Other'],
];
const LIKERT_ANCHORS = ['전혀 그렇지 않다', '매우 그렇다'];

/* =====================================================================
 * Storage (IndexedDB — 이미지 포함 세션이 localStorage 용량을 넘기 때문)
 * ===================================================================== */
const DB = {
  _db: null,
  mem: null,   // IndexedDB를 못 쓰는 브라우저(시크릿 모드, 인앱 브라우저 등)용 임시 저장소
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('ownership-study', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('sessions', { keyPath: 'id' });
        r.onsuccess = () => { this._db = r.result; res(r.result); };
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('IndexedDB timeout')), 3000);
      } catch (e) { rej(e); }
    });
  },
  async tx(mode, fn) {
    if (!this.mem) {
      try { await this.open(); } catch (e) { this.mem = new Map(); console.warn('IndexedDB unavailable, using memory', e); }
    }
    if (this.mem) {
      const st = { put: s => this.mem.set(s.id, s), getAll: () => ({ result: [...this.mem.values()] }), delete: id => this.mem.delete(id) };
      const out = fn(st); return out && out.result !== undefined ? out.result : undefined;
    }
    const db = this._db;
    return new Promise((res, rej) => {
      const t = db.transaction('sessions', mode);
      const out = fn(t.objectStore('sessions'));
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  put(s) { return this.tx('readwrite', st => st.put(JSON.parse(JSON.stringify(s)))); },
  getAll() { return this.tx('readonly', st => st.getAll()); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },
};

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* =====================================================================
 * Randomization — 블록 무선배정 (A/B 각 N/2), 시드 기반으로 재현 가능
 * ===================================================================== */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeAssignment(n, seed) {
  const rnd = mulberry32(seed);
  // 층(창작 경험 있음/없음)마다 4명 단위 블록 = 조건(A/B) × 세계관(2개) 네 칸을 한 번씩 섞어 배치
  // → 두 층 모두에서 조건·세계관이 균형, 중도 종료 시에도 균형 유지. ID: E01… / N01…
  const cells = ['A', 'B'].flatMap(c => WORLDS.map(w => [c, w.id]));
  return STRATA.flatMap(st => {
    const out = [];
    while (out.length < n) {
      const block = cells.slice();
      for (let i = block.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [block[i], block[j]] = [block[j], block[i]]; }
      out.push(...block);
    }
    return out.slice(0, n).map(([c, w], i) => ({ pid: st.id + String(i + 1).padStart(2, '0'), stratum: st.id, condition: c, world: w }));
  });
}
function getAssignment() {
  let a = LS.get('assignment', null);
  if (a && a.table.some(r => !r.world || !r.stratum)) a = null;   // 이전 형식 배정표는 새로 만듦
  if (!a) { a = { seed: Math.floor(Math.random() * 1e9), table: null }; a.table = makeAssignment(CONFIG.N_PER_STRATUM, a.seed); LS.set('assignment', a); }
  return a;
}
const getStratum = id => STRATA.find(s => s.id === id);

/* =====================================================================
 * Image generation providers
 * ===================================================================== */
function blobToDataUrl(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

const PROVIDERS = {
  pollinations: {
    label: 'Pollinations (FLUX, 무료·키 불필요 — 테스트/파일럿용, 45초당 1장 제한)',
    model: () => 'pollinations/' + CONFIG.POLLINATIONS_MODEL,
    cooldownSec: 46,   // 무료 티어: IP당 45초에 1장
    async generate(fullPrompt, seed) {
      const { width, height } = CONFIG.IMAGE;
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${width}&height=${height}&seed=${seed}&model=${CONFIG.POLLINATIONS_MODEL}&nologo=true&private=true&enhance=false`;
      const r = await withTimeout(fetch(url), CONFIG.GEN_TIMEOUT_MS);
      if (!r.ok) {
        const msg = await r.text().catch(() => '');
        const m = msg.match(/Retry after (\d+)s/);
        const err = new Error('HTTP ' + r.status + (m ? ` (retry after ${m[1]}s)` : ''));
        if (m) err.retryAfterSec = +m[1];
        throw err;
      }
      return blobToDataUrl(await r.blob());
    },
  },
  openai: {
    label: 'OpenAI GPT Image (유료 API 키 필요, 한국어 이해 우수 — 본 실험 권장)',
    model: () => `openai/${LS.get('openaiModel', CONFIG.OPENAI_MODEL)}/${LS.get('openaiQuality', CONFIG.OPENAI_QUALITY)}`,
    supportsSketch: true,
    async generate(fullPrompt, seed, sketchDataUrl) {
      const key = LS.get('openaiKey', '');
      if (!key) throw new Error('OpenAI API 키가 설정되지 않음');
      const model = LS.get('openaiModel', CONFIG.OPENAI_MODEL), quality = LS.get('openaiQuality', CONFIG.OPENAI_QUALITY);
      let req;
      if (sketchDataUrl) {
        // 스케치를 참고 이미지로 함께 보냄 (images/edits)
        const fd = new FormData();
        fd.append('model', model); fd.append('prompt', fullPrompt); fd.append('size', '1024x1536'); fd.append('quality', quality); fd.append('n', '1');
        fd.append('image', await (await fetch(sketchDataUrl)).blob(), 'sketch.jpg');
        req = fetch('https://api.openai.com/v1/images/edits', { method: 'POST', headers: { Authorization: 'Bearer ' + key }, body: fd });
      } else {
        req = fetch('https://api.openai.com/v1/images/generations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
          body: JSON.stringify({ model, prompt: fullPrompt, size: '1024x1536', quality, n: 1 }),
        });
      }
      const r = await withTimeout(req, CONFIG.GEN_TIMEOUT_MS);
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || 'HTTP ' + r.status);
      return 'data:image/png;base64,' + j.data[0].b64_json;
    },
  },
  mock: {
    label: 'Mock (오프라인 리허설용 — 가짜 이미지)',
    model: () => 'mock',
    supportsSketch: true,
    async generate(fullPrompt, seed, sketchDataUrl) {
      await new Promise(r => setTimeout(r, 1200));
      const hue = seed % 360;
      const words = fullPrompt.replace(CONFIG.SKETCH_INSTRUCTION, '').split(',')[0].slice(0, 120).replace(/[<&>]/g, '');
      const lines = words.match(/.{1,22}/g) || [''];
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${CONFIG.IMAGE.width}" height="${CONFIG.IMAGE.height}">
        <rect width="100%" height="100%" fill="hsl(${hue},45%,88%)"/>
        <circle cx="384" cy="330" r="120" fill="hsl(${hue},40%,60%)"/>
        <rect x="264" y="470" width="240" height="380" rx="60" fill="hsl(${hue},40%,55%)"/>
        <text x="384" y="930" font-size="30" text-anchor="middle" fill="#333">MOCK · seed ${seed}${sketchDataUrl ? ' · 스케치 사용' : ''}</text>
        ${sketchDataUrl ? `<image href="${sketchDataUrl}" x="560" y="40" width="180" height="240" opacity=".9"/>` : ''}
        ${lines.map((l, i) => `<text x="384" y="${80 + i * 38}" font-size="30" text-anchor="middle" fill="#222">${l}</text>`).join('')}
      </svg>`;
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    },
  },
};

async function go(screen) {
  if (S) {
    if (S.screen) log('screen_exit', { screen: S.screen });
    S.screen = screen;
    S.screenTimes[screen] = S.screenTimes[screen] || now();
    log('screen_enter', { screen });
    await save();
  }
  clearInterval(timerHandle);
  window.scrollTo(0, 0);
  const idx = FLOW.indexOf(screen);
  document.getElementById('hdr-step').textContent = idx >= 0 ? `${idx + 1} / ${FLOW.length} · ${STEP_LABEL[screen]}` : '';
  SCREENS[screen]();
}

function likertHtml(scaleKey) {
  const sc = SCALES[scaleKey];
  return `<div class="likert">
    <div class="anchors"><div></div><div><span>1 ${LIKERT_ANCHORS[0]}</span><span>${LIKERT_ANCHORS[1]} 7</span></div></div>
    ${sc.items.map(([id, ko, en]) => `
      <div class="row" data-item="${id}">
        <div>${esc(ko)}<span class="en">${esc(en)}</span></div>
        <div class="opts">${[1, 2, 3, 4, 5, 6, 7].map(v => `<label><input type="radio" name="${id}" value="${v}" ${S.post[id] == v ? 'checked' : ''}>${v}</label>`).join('')}</div>
      </div>`).join('')}
  </div>`;
}
function readLikert(scaleKey) {
  let ok = true;
  for (const [id] of SCALES[scaleKey].items) {
    const el = app.querySelector(`input[name="${id}"]:checked`);
    const row = app.querySelector(`.row[data-item="${id}"]`);
    if (!el) { ok = false; row.classList.add('missing'); } else { S.post[id] = +el.value; row.classList.remove('missing'); }
  }
  return ok;
}
function likertGenericHtml(name, label, value, anchors = ['전혀 없음', '매우 많음']) {
  return `<div class="likert"><div class="anchors"><div></div><div><span>1 ${anchors[0]}</span><span>${anchors[1]} 7</span></div></div>
    <div class="row" data-item="${name}"><div>${label}</div>
    <div class="opts">${[1, 2, 3, 4, 5, 6, 7].map(v => `<label><input type="radio" name="${name}" value="${v}" ${value == v ? 'checked' : ''}>${v}</label>`).join('')}</div></div></div>`;
}
function sliderHtml(name, value) {
  const touched = value !== undefined && value !== null;
  return `<div class="slider-wrap ${touched ? '' : 'untouched'}" data-slider="${name}">
    <span class="muted">0</span><input type="range" min="0" max="100" step="1" value="${touched ? value : 50}" name="${name}">
    <span class="muted">100</span><output>${touched ? value : '—'}</output></div>`;
}
function bindSliders() {
  $$('.slider-wrap').forEach(w => {
    const inp = w.querySelector('input'), out = w.querySelector('output');
    const upd = () => { w.classList.remove('untouched'); w.dataset.touched = '1'; out.textContent = inp.value; };
    inp.addEventListener('input', upd); inp.addEventListener('change', upd);
    if (!w.classList.contains('untouched')) w.dataset.touched = '1';
  });
}

/* 권장 시간 안내 (강제 아님): 경과 시간을 보여 주고 권장 시간을 넘기면 마무리를 부탁 */
function softTimer(el, suggestedSec, t0 = Date.now()) {
  const tick = () => {
    const e = $(el); if (!e) return;
    const s = Math.floor((Date.now() - t0) / 1000), fmt = x => `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`;
    const over = s >= suggestedSec;
    e.textContent = over ? `경과 ${fmt(s)} · 권장 시간이 지났어요. 마무리해 주세요` : `경과 ${fmt(s)} / 권장 ${Math.round(suggestedSec / 60)}분`;
    e.classList.toggle('low', over);
  };
  clearInterval(timerHandle); tick(); timerHandle = setInterval(tick, 1000);
  return t0;
}

/* ---------- 5. Hand sketch ---------- */
SCREENS.sketch = function () {
  h(`<h1>손 스케치</h1><p class="lead">컨셉 시트를 바탕으로 캐릭터를 간단히 스케치해 주세요. 잘 그릴 필요는 없습니다 — 형태와 핵심 특징만 표현되면 충분합니다. (권장 ${Math.round(CONFIG.SKETCH_SUGGESTED_SEC / 60)}분)</p>
  <div class="split">
    <div class="card concept-panel">${conceptPanelHtml({ withSketch: false })}</div>
    <div class="card">
      <div class="sketch-tools">
        <button class="secondary on" data-tool="pen">펜</button>
        <button class="secondary" data-tool="eraser">지우개</button>
        <select id="size" style="width:auto"><option value="3">가늘게</option><option value="6" selected>보통</option><option value="12">굵게</option></select>
        <button class="secondary" id="undo">되돌리기</button>
        <button class="secondary" id="clear">전체 지우기</button>
        <span class="muted" id="sketchTimer"></span>
      </div>
      <canvas id="sketch" width="900" height="1200"></canvas>
      <p class="muted" style="margin-top:10px">종이에 그렸다면: <input type="file" id="upload" accept="image/*" style="width:auto"> (사진 업로드 시 위 캔버스 내용을 대체합니다)</p>
      <div class="err" id="err"></div>
      <div class="actions"><button id="next">스케치 완료</button></div>
    </div>
  </div>`);
  const cv = $('#sketch'), ctx = cv.getContext('2d');
  const blank = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); };
  blank();
  let tool = 'pen', drawing = false, strokes = S.sketch.strokes || 0, source = 'canvas';
  const undo = [];
  if (S.sketch.dataUrl) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, cv.width, cv.height); im.src = S.sketch.dataUrl; }
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', e => {
    undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 30) undo.shift();
    drawing = true; cv.setPointerCapture(e.pointerId);
    ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = tool === 'pen' ? '#111' : '#fff';
    ctx.lineWidth = +$('#size').value * (tool === 'eraser' ? 3 : 1);
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); ctx.stroke();
  });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
  const end = () => { if (drawing) { drawing = false; strokes++; source = 'canvas'; } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  $$('[data-tool]').forEach(b => b.onclick = () => { tool = b.dataset.tool; $$('[data-tool]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#undo').onclick = () => { const d = undo.pop(); if (d) { ctx.putImageData(d, 0, 0); strokes = Math.max(0, strokes - 1); } };
  $('#clear').onclick = () => { undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); blank(); strokes = 0; };
  $('#upload').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const url = await blobToDataUrl(f); const im = new Image();
    im.onload = () => { blank(); const s = Math.min(cv.width / im.width, cv.height / im.height); ctx.drawImage(im, (cv.width - im.width * s) / 2, (cv.height - im.height * s) / 2, im.width * s, im.height * s); source = 'upload'; strokes = Math.max(strokes, 1); };
    im.src = url;
  };
  const t0 = Date.now();
  softTimer('#sketchTimer', CONFIG.SKETCH_SUGGESTED_SEC, t0);
  $('#next').onclick = () => {
    if (strokes < 1) return $('#err').textContent = '간단하게라도 스케치해 주세요.';
    S.sketch = { dataUrl: cv.toDataURL('image/jpeg', 0.85), strokes, source, seconds: Math.round((Date.now() - t0) / 1000) };
    log('sketch_submit', { strokes, source, seconds: S.sketch.seconds });
    go('genIntro');
  };
};

/* ---------- 7. Generation ----------
 * 작성 시간 총량 A/B 동일: A는 ROUND_SEC_A 고정 1회, B는 ROUND_SEC_B 고정 + 수정 최대 REVISION_SEC · 같은 길이 범위 → 스케치 + 프롬프트로 생성
 * B만: 1차 결과를 보고 선택적으로 프롬프트 수정(최대 REVISION_SEC) → 스케치 + 수정 프롬프트로 1회 재생성 → 2차가 최종 */
function editDistance(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

SCREENS.gen = function () {
  const A = S.condition === 'A';
  const G = S.gen;
  if (!G.phaseStart) Object.assign(G, { phaseStart: now(), phaseStartMs: Date.now(), rounds: [], round: 1, stage: 'write' });
  const prov = PROVIDERS[S.provider];
  const okAttempts = () => G.attempts.filter(a => a.ok);
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  h(`<h1>AI 캐릭터 생성</h1>
  <div class="split">
    <div class="card concept-panel">${conceptPanelHtml()}</div>
    <div class="card" id="genCard"></div>
  </div>`);
  const card = $('#genCard');

  /* --- 프롬프트 작성 (1차: 고정 시간 / 2차(B): 최대 시간, 일찍 생성 가능) --- */
  function stageWrite() {
    const r = G.round, revising = r === 2;
    const limit = revising ? CONFIG.REVISION_SEC : roundSec(S.condition);
    if (!G.rounds[r - 1]) {
      G.rounds[r - 1] = { n: r, startedAt: now(), startMs: Date.now(), inputEvents: 0, prompt: revising ? G.rounds[0].prompt : '' };
      log('round_start', { round: r });
      save();
    }
    const RD = G.rounds[r - 1];
    const prevImg = revising ? okAttempts().slice(-1)[0] : null;
    card.innerHTML = `
      <div class="gen-status"><span><b>${revising ? '프롬프트 수정' : '프롬프트 작성'}</b></span><span class="timer" id="timer"></span></div>
      <p class="muted" style="margin-top:0">${revising
        ? '1차 결과에서 의도와 다른 부분이 드러나도록 프롬프트를 수정해 주세요. 스케치와 수정한 프롬프트로 다시 생성합니다.'
        : '최종 이미지에서 표현되기를 원하는 외형, 표정, 의상, 분위기, 핵심 특징을 중심으로 가능한 한 충실하게 작성해 주세요. 스케치는 자동으로 함께 전달됩니다.'}</p>
      ${prevImg ? `<div class="attempt" style="max-width:260px;margin-bottom:14px"><img src="${prevImg.image}" alt="1차 결과"><div class="cap"><span>1차 결과</span></div></div>` : ''}
      <textarea id="prompt" maxlength="${CONFIG.PROMPT_MAX_CHARS}" style="min-height:150px" placeholder="예: a teenage girl with short silver hair and freckles, wearing an oversized patched coat, carrying a big old book..."></textarea>
      <div class="gen-status" style="margin-top:6px"><span id="chars" class="muted"></span><span class="muted">${revising ? '시간이 끝나면 자동으로 생성됩니다' : '시간이 끝나면 자동으로 생성됩니다 (일찍 끝낼 수 없음)'}</span></div>
      <div class="err" id="err"></div>
      ${revising ? '<div class="actions"><button class="secondary" id="cancelRev">수정하지 않고 1차 결과로 확정</button><button id="regen" disabled>수정한 프롬프트로 다시 생성</button></div>' : ''}`;
    const ta = $('#prompt');
    ta.value = RD.draft ?? RD.prompt ?? '';
    const lenOk = () => ta.value.trim().length >= CONFIG.PROMPT_MIN_CHARS;
    const changed = () => !revising || ta.value.trim() !== G.rounds[0].prompt;
    const upd = () => {
      const n = ta.value.trim().length;
      $('#chars').innerHTML = `<span style="color:${lenOk() ? 'var(--ok)' : 'var(--warn)'}">${n}자</span> / 최소 ${CONFIG.PROMPT_MIN_CHARS} · 최대 ${CONFIG.PROMPT_MAX_CHARS}`;
      if (revising) $('#regen').disabled = !lenOk() || !changed();
    };
    ta.addEventListener('input', () => { RD.draft = ta.value; RD.inputEvents++; upd(); if (RD.overtime) tick(); });
    upd(); ta.focus();

    function finish(how) {
      clearInterval(timerHandle);
      const elapsed = Math.round((Date.now() - RD.startMs) / 1000);
      Object.assign(RD, { prompt: ta.value.trim(), endedAt: now(), writeSeconds: elapsed, overtimeSec: Math.max(0, elapsed - limit), endedBy: how });
      delete RD.draft;
      log('round_end', { round: r, chars: RD.prompt.length, inputEvents: RD.inputEvents, how });
      G.stage = 'generating'; save(); stageGenerate(RD.prompt);
    }
    function tick() {
      const left = limit - Math.floor((Date.now() - RD.startMs) / 1000);
      const el = $('#timer'); if (!el) return;
      el.textContent = left > 0 ? `${revising ? '최대 ' : ''}남은 시간 ${fmt(left)}` : '시간 종료';
      el.classList.toggle('low', left <= 30);
      if (left <= 0) {
        if (revising && !changed()) return keepFirst('timeout_unchanged');
        if (lenOk()) return finish('timeout');
        if (!RD.overtime) { RD.overtime = true; log('round_overtime', { round: r }); }
        $('#err').textContent = `최소 ${CONFIG.PROMPT_MIN_CHARS}자 이상 작성하면 자동으로 생성됩니다.`;
      }
    }
    if (revising) {
      $('#regen').onclick = () => { if (lenOk() && changed()) finish('button'); };
      $('#cancelRev').onclick = () => keepFirst('cancel');
    }
    clearInterval(timerHandle); tick(); timerHandle = setInterval(tick, 500);
  }

  /* B: 수정 없이 1차 결과를 최종으로 */
  function keepFirst(how) {
    clearInterval(timerHandle);
    const RD = G.rounds[1];
    if (RD) { Object.assign(RD, { endedAt: now(), writeSeconds: Math.round((Date.now() - RD.startMs) / 1000), endedBy: how, abandoned: true }); delete RD.draft; }
    G.revised = false; G.finalIdx = okAttempts()[0].idx; G.stage = 'final';
    log('keep_first', { how });
    save(); stageFinal();
  }

  /* --- B: 1차 결과 확인 후 선택 --- */
  function stageDecide() {
    clearInterval(timerHandle);
    const first = okAttempts()[0];
    card.innerHTML = `
      <h2 style="margin-top:0">1차 결과</h2>
      <img class="final-img" src="${first.image}" alt="1차 결과">
      <p style="text-align:center;margin-top:14px">이 이미지가 의도한 캐릭터와 다르다면 프롬프트를 수정해 <b>한 번 더</b> 생성할 수 있습니다.<br><span class="muted">다시 생성하면 두 번째 이미지가 최종 캐릭터가 됩니다.</span></p>
      <div class="actions" style="justify-content:center">
        <button class="secondary" id="keep">이대로 최종 확정</button>
        <button id="revise">프롬프트 수정하기</button>
      </div>`;
    if (!G.decideStartMs) { G.decideStartMs = Date.now(); save(); }
    $('#keep').onclick = () => { G.decideSeconds = Math.round((Date.now() - G.decideStartMs) / 1000); keepFirst('keep'); };
    $('#revise').onclick = () => {
      G.decideSeconds = Math.round((Date.now() - G.decideStartMs) / 1000);
      G.revised = true; G.round = 2; G.stage = 'write'; log('choose_revise'); save(); stageWrite();
    };
  }

  /* --- 생성 (스케치 + 프롬프트). 실패/쿨다운 시 자동 재시도, 횟수에 포함 안 됨 --- */
  async function stageGenerate(prompt) {
    clearInterval(timerHandle);
    const label = G.round === 1 ? (A ? '' : '1차 ') : '2차 ';
    card.innerHTML = `<div class="spinner"></div><p class="muted" style="text-align:center" id="genMsg">스케치와 프롬프트로 ${label}이미지를 생성하고 있습니다… (최대 1분 정도)</p><div class="err" id="err" style="text-align:center"></div><div class="actions" style="justify-content:center" id="retryBox"></div>`;
    const useSketch = CONFIG.USE_SKETCH && prov.supportsSketch && S.sketch?.dataUrl;
    for (let tries = 0; tries < 4; tries++) {
      const wait = Math.max(0, Math.ceil(((G.nextAllowedMs || 0) - Date.now()) / 1000));
      for (let s = wait; s > 0; s--) { $('#genMsg').textContent = `이미지 생성 대기 중… ${s}초`; await new Promise(r => setTimeout(r, 1000)); }
      const seed = Math.floor(Math.random() * 1e9);
      const fullPrompt = (useSketch ? CONFIG.SKETCH_INSTRUCTION : '') + prompt + CONFIG.STYLE_SUFFIX;
      const att = { idx: G.attempts.length, round: G.round, prompt, fullPrompt, usedSketch: !!useSketch, seed, requestedAt: now(), tRequestMs: Date.now() - G.phaseStartMs };
      log('generate_request', { idx: att.idx, round: G.round, seed, usedSketch: att.usedSketch });
      if (prov.cooldownSec) G.nextAllowedMs = Date.now() + prov.cooldownSec * 1000;
      try {
        att.image = await prov.generate(fullPrompt, seed, useSketch ? S.sketch.dataUrl : null);
        att.ok = true; att.n = okAttempts().length + 1;
      } catch (e) {
        att.ok = false; att.error = String(e.message || e);
        if (e.retryAfterSec) G.nextAllowedMs = Date.now() + (e.retryAfterSec + 1) * 1000;
      }
      att.receivedAt = now(); att.latencyMs = Date.parse(att.receivedAt) - Date.parse(att.requestedAt);
      G.attempts.push(att);
      log('generate_response', { idx: att.idx, ok: att.ok, latencyMs: att.latencyMs, error: att.error });
      await save();
      if (att.ok) {
        if (G.round === 1 && !A) { G.stage = 'decide'; await save(); return stageDecide(); }
        G.finalIdx = att.idx; G.stage = 'final'; await save(); return stageFinal();
      }
      $('#err').textContent = `생성 실패 (${att.error}). 자동으로 다시 시도합니다…`;
    }
    $('#err').textContent = '이미지 생성에 계속 실패하고 있습니다. 연구자에게 알려 주세요.';
    $('#retryBox').innerHTML = '<button id="retry">다시 시도</button>';
    $('#retry').onclick = () => stageGenerate(prompt);
  }

  /* --- 최종 결과 --- */
  function stageFinal() {
    clearInterval(timerHandle);
    const fin = G.attempts.find(a => a.idx === G.finalIdx);
    const other = !A ? okAttempts().find(a => a.idx !== G.finalIdx) : null;
    card.innerHTML = `
      <h2 style="margin-top:0">최종 캐릭터</h2>
      <img class="final-img" src="${fin.image}" alt="최종 캐릭터">
      ${other ? `<p class="muted" style="text-align:center">1차 결과</p><img src="${other.image}" alt="1차 결과" style="max-width:140px;display:block;margin:0 auto;border-radius:6px;opacity:.8">` : ''}
      <div class="actions"><button id="submit">확인하고 설문으로 이동</button></div>`;
    $('#submit').onclick = () => {
      G.phaseEnd = now(); G.genSeconds = Math.round((Date.now() - G.phaseStartMs) / 1000);
      log('final_submit', { finalIdx: G.finalIdx, genSeconds: G.genSeconds });
      go('postPO');
    };
  }

  if (G.stage === 'final') stageFinal();
  else if (G.stage === 'decide') stageDecide();
  else if (G.stage === 'generating') stageGenerate(G.rounds[G.round - 1].prompt);
  else stageWrite();
};

    <label class="field" style="margin-top:22px">최종 캐릭터를 만드는 데 나와 AI는 각각 얼마나 기여했다고 생각하십니까?<span class="en">How much did you and the AI each contribute to creating the final character?</span></label>
    <p class="muted" style="margin:0">0 = 전적으로 내가 만듦 · 50 = 반반 · 100 = 전적으로 AI가 만듦</p>${sliderHtml('ai_contribution', p.ai_contribution)}
  </div>
  <div class="card">
    <label class="field">최종 캐릭터의 전반적인 품질을 어떻게 평가하십니까?<span class="en">How would you rate the overall quality of your final character?</span></label>
    <p class="muted" style="margin:0">0 = 매우 낮은 품질 · 100 = 매우 높은 품질</p>${sliderHtml('quality', p.quality)}
    <label class="field" style="margin-top:22px">이 캐릭터를 만드는 데 얼마나 노력을 기울였습니까?<span class="en">How much effort did you put into creating this character?</span></label>
    <p class="muted" style="margin:0">0 = 매우 적은 노력 · 100 = 매우 많은 노력</p>${sliderHtml('effort', p.effort)}
  </div>
  <div class="card">
    <label class="field">이 캐릭터가 '내 것'이라고 느껴진(혹은 느껴지지 않은) 이유가 있다면 자유롭게 적어 주세요. <small>(선택)</small></label>
    <textarea id="open1">${esc(p.open_ownership)}</textarea>
    <label class="field">AI 생성 과정에서 기대와 달랐던 점이 있었다면 적어 주세요. <small>(선택)</small></label>
    <textarea id="open2">${esc(p.open_process)}</textarea>
  </div>
  <div class="err" id="err"></div><div class="actions"><button id="next">제출</button></div>`);
  bindSliders();
  $('#next').onclick = async () => {
    const q = $('[data-slider="quality"]'), e = $('[data-slider="effort"]'), ac = $('[data-slider="ai_contribution"]');
    const sat = app.querySelector('input[name="satisfaction"]:checked');
    if (!sat) return $('#err').textContent = '만족도 문항에 응답해 주세요.';
    if (!q.dataset.touched || !e.dataset.touched || !ac.dataset.touched) return $('#err').textContent = '슬라이더를 모두 움직여 응답해 주세요.';
    p.satisfaction = +sat.value; p.ai_contribution = +ac.querySelector('input').value;
    p.quality = +q.querySelector('input').value; p.effort = +e.querySelector('input').value;
    p.open_ownership = $('#open1').value.trim(); p.open_process = $('#open2').value.trim();
    S.completedAt = now();
    log('session_complete');
    go('done');
  };
};

/* ---------- 12. Done ---------- */
SCREENS.done = async function () {
  await save();
  // 세션별 백업 파일 자동 저장 (브라우저 데이터 손실 대비)
  download(`${S.id}.json`, JSON.stringify(S, null, 1), 'application/json');
  h(`<h1>참여해 주셔서 감사합니다!</h1>
  <div class="card"><p>모든 과정이 완료되었습니다. 연구자에게 알려 주세요.</p>
  <img class="final-img" src="${finalImage()}" alt="최종 캐릭터" style="max-width:240px"></div>
  <p class="muted" style="text-align:center">연구자: Ctrl+Shift+A 로 연구자 화면으로 이동</p>`);
};

/* =====================================================================
 * Export
 * ===================================================================== */
function mean(xs) { const v = xs.filter(x => typeof x === 'number'); return v.length === xs.length && v.length ? +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(3) : null; }
function roundFields(rs) {
  const r1 = rs[0] || {}, r2 = rs[1] && !rs[1].abandoned ? rs[1] : {};   // 수정을 취소한 B는 2차 기록 없음
  return {
    round1_prompt: r1.prompt ?? '', round1_chars: r1.prompt?.length ?? null, round1_input_events: r1.inputEvents ?? null, round1_seconds: r1.writeSeconds ?? null,
    round2_prompt: r2.prompt ?? '', round2_chars: r2.prompt?.length ?? null, round2_input_events: r2.inputEvents ?? null, round2_seconds: r2.writeSeconds ?? null,
    round2_edit_distance: r1.prompt != null && r2.prompt != null && !r2.abandoned ? editDistance(r1.prompt, r2.prompt) : null,
    write_seconds_total: rs.length ? rs.reduce((t, r) => t + (r.abandoned ? 0 : r.writeSeconds || 0), 0) : null,   // 실제로 생성에 쓰인 작성 시간 합
    overtime_seconds: rs.reduce((t, r) => t + (r.overtimeSec || 0), 0),
  };
}
function flatten(s) {
  const p = s.post || {}, g = s.gen || { attempts: [] };
  const ok = g.attempts.filter(a => a.ok);
  const fin = ok.find(a => a.idx === g.finalIdx);
  const sc = k => SCALES[k].items.map(([id]) => p[id]);
  const row = {
    pid: s.pid, session_id: s.id, stratum: s.stratum ?? '', condition: s.condition, world: s.world ?? '', is_test: s.isTest ? 1 : 0, completed: s.completedAt ? 1 : 0,
    provider: s.provider, model: s.model, started_at: s.startedAt, completed_at: s.completedAt,
    total_minutes: s.completedAt ? +((Date.parse(s.completedAt) - Date.parse(s.startedAt)) / 60000).toFixed(2) : null,
    ...Object.fromEntries(['ai_text_freq', 'ai_image_freq', 'ai_image_skill', 'art_exp', 'char_exp', 'draw_skill', 'age', 'gender'].map(k => ['pre_' + k, s.pre?.[k] ?? null])),
    pre_ai_tools: (s.pre?.ai_tools || []).join('|'),
    concept_chars: Object.values(s.concept || {}).join('').length, concept_seconds: s.conceptSeconds ?? null,
    concept_mbti: s.concept?.mbti ?? '', concept_traits: (s.concept?.traits || []).join('|'),
    sketch_strokes: s.sketch?.strokes ?? null, sketch_source: s.sketch?.source ?? null, sketch_seconds: s.sketch?.seconds ?? null,
    n_generations: ok.length, n_failed_generations: g.attempts.length - ok.length,
    gen_seconds: g.genSeconds ?? null,
    b_revised: s.condition === 'B' && g.revised != null ? (g.revised ? 1 : 0) : null,
    b_decide_seconds: g.decideSeconds ?? null,
    used_sketch: ok.length ? (ok.every(a => a.usedSketch) ? 1 : 0) : null,
    ...roundFields(g.rounds || []),
    final_prompt: fin?.prompt ?? '', final_prompt_chars: fin?.prompt.length ?? null,
  };
  for (const k of Object.keys(SCALES)) { SCALES[k].items.forEach(([id]) => row[id] = p[id] ?? null); row[k + '_mean'] = mean(sc(k)); }
  Object.assign(row, { credit: p.credit ?? null, credit_other: p.credit_other ?? '',
    satisfaction: p.satisfaction ?? null, ai_contribution: p.ai_contribution ?? null, quality: p.quality ?? null, effort: p.effort ?? null,
    open_ownership: p.open_ownership ?? '', open_process: p.open_process ?? '' });
  return row;
}
function toCsv(rows) {
  if (!rows.length) return '';
  const cols = Object.keys(rows[0]);
  const cell = v => { if (v == null) return ''; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
}
function exportCsv(sessions) { download(`ownership_study_${stamp()}.csv`, '﻿' + toCsv(sessions.map(flatten)), 'text/csv'); }
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function stamp() { return new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-'); }

/* =====================================================================
 * Boot
 * ===================================================================== */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
    if (S && !S.completedAt && !confirm('진행 중인 세션을 일시정지하고 연구자 화면으로 갈까요? (목록에서 재개 가능)')) return;
    if (S) { log('admin_interrupt'); save(); }
    S = null; clearInterval(timerHandle); SCREENS.admin();
  }
});
function showFatal(msg) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;background:#fff4f0;border:1px solid #b4441f;color:#b4441f;padding:10px 14px;border-radius:8px;font-size:14px;z-index:99';
  d.textContent = '오류가 발생했습니다: ' + msg + ' — 이 메시지를 연구자에게 알려 주세요.';
  document.body.appendChild(d);
}
window.addEventListener('error', e => showFatal(e.message));
window.addEventListener('unhandledrejection', e => showFatal(e.reason?.message || String(e.reason)));
window.addEventListener('beforeunload', e => { if (S && !S.completedAt) { e.preventDefault(); e.returnValue = ''; } });
SCREENS.admin();
</script>
